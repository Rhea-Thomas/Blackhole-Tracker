{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h1>Add Discovery Method</h1>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="POST">
        <div class="form-group">
            <label>Method Name</label>
            <input type="text" name="method_name" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Year Developed</label>
            <input type="number" name="year_developed" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" class="form-control"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Add</button>
        <a href="{{ url_for('view_discovery_methods') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
