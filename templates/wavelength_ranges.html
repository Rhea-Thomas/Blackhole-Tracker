{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h1>Wavelength Ranges</h1>
    <a href="{{ url_for('add_wavelength_range') }}" class="btn btn-primary mb-3">Add Wavelength Range</a>
    <table class="table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Min</th>
                <th>Max</th>
                <th>Unit</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for wl in wavelengths %}
            <tr>
                <td>{{ wl[1] }}</td>
                <td>{{ wl[2] }}</td>
                <td>{{ wl[3] }}</td>
                <td>{{ wl[4] }}</td>
                <td>
                    <a href="{{ url_for('edit_wavelength_range', wavelength_id=wl[0]) }}" class="btn btn-sm btn-warning">Edit</a>
                    <form method="POST" action="{{ url_for('delete_wavelength_range', wavelength_id=wl[0]) }}" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
