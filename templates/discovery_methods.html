{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h1>Discovery Methods</h1>
    <a href="{{ url_for('add_discovery_method') }}" class="btn btn-primary mb-3">Add Discovery Method</a>
    <table class="table">
        <thead>
            <tr>
                <th>Method Name</th>
                <th>Year Developed</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for method in methods %}
            <tr>
                <td>{{ method[1] }}</td>
                <td>{{ method[2] }}</td>
                <td>{{ method[3] }}</td>
                <td>
                    <a href="{{ url_for('edit_discovery_method', method_id=method[0]) }}" class="btn btn-sm btn-warning">Edit</a>
                    <form method="POST" action="{{ url_for('delete_discovery_method', method_id=method[0]) }}" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
