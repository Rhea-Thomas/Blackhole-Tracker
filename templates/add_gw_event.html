{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h1>Add Gravitational Wave Event</h1>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="POST">
        <div class="form-group">
            <label>Event Name</label>
            <input type="text" name="event_name" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Black Hole 1</label>
            <select name="bh1_id" class="form-control" required>
                <option value="">Select</option>
                {% for bh in black_holes %}
                <option value="{{ bh[0] }}">{{ bh[1] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Black Hole 2</label>
            <select name="bh2_id" class="form-control" required>
                <option value="">Select</option>
                {% for bh in black_holes %}
                <option value="{{ bh[0] }}">{{ bh[1] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Event Date</label>
            <input type="date" name="event_date" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Mass 1</label>
            <input type="number" step="0.01" name="mass_1" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Mass 2</label>
            <input type="number" step="0.01" name="mass_2" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Final Mass</label>
            <input type="number" step="0.01" name="final_mass" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Energy Released</label>
            <input type="number" step="0.01" name="energy_released" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Add</button>
        <a href="{{ url_for('view_gw_events') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
