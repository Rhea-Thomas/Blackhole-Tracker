<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Black Hole Observation Tracker{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-image: url('/static/home.gif');
            background-size: cover;
            background-attachment: fixed;
            color: #fff; 
        }
        
        .navbar { 
            background: transparent;
            border: none;
            padding: 15px 0;
        }
        
        .navbar-brand {
            font-size: 24px;
            font-weight: bold;
            color: #fff !important;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            letter-spacing: 2px;
        }
        
        .nav-link {
            color: #fff !important;
            font-weight: 600;
            padding: 10px 20px !important;
            margin: 0 5px;
            border-radius: 8px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.2),
                        inset 0 -2px 4px rgba(0, 0, 0, 0.2),
                        0 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        
        .nav-link:hover {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.1));
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.3),
                        inset 0 -2px 4px rgba(0, 0, 0, 0.3),
                        0 6px 12px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
        }
        
        .card { 
            background: rgba(26, 26, 46, 0.95);
            border: 1px solid rgba(22, 33, 62, 0.8);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .btn-primary { 
            background: linear-gradient(145deg, #e94560, #d63447);
            border: none;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover { 
            background: linear-gradient(145deg, #d63447, #c02a3a);
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6);
            transform: translateY(-2px);
        }
        
        .table { 
            color: #fff;
            background: rgba(0, 0, 0, 0.3);
        }
        
        .table thead { 
            background: rgba(15, 52, 96, 0.6);
        }
        
        .table tbody tr:hover {
            background: rgba(233, 69, 96, 0.1);
        }
        
        /* READABLE FORM INPUTS */
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.95) !important;
            color: #000 !important;
            border: 2px solid rgba(233, 69, 96, 0.3);
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 1) !important;
            color: #000 !important;
            border-color: #e94560;
            box-shadow: 0 0 0 0.2rem rgba(233, 69, 96, 0.25);
        }
        
        .form-control::placeholder {
            color: #666 !important;
            opacity: 0.7;
        }
        
        .form-select option {
            background: #fff;
            color: #000;
        }
        
        .form-label {
            color: #fff !important;
            font-weight: 600;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
            margin-bottom: 8px;
            font-size: 15px;
        }
        
        /* Textarea readable */
        textarea.form-control {
            background: rgba(255, 255, 255, 0.95) !important;
            color: #000 !important;
        }
        
        /* SUCCESS/ERROR ALERTS */
        .alert {
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 20px;
            animation: slideDown 0.5s ease;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            font-size: 15px;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .alert-success {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
        }
        
        .alert-danger {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            border: none;
        }
        
        .alert-info {
            background: linear-gradient(135deg, #17a2b8 0%, #138496 100%);
            color: white;
            border: none;
        }
        
        .btn-close-white {
            filter: brightness(0) invert(1);
        }
        
        /* Carousel styling */
        .carousel-item {
            height: 500px;
            position: relative;
        }

        .carousel-item img {
            height: 100%;
            object-fit: cover;
        }

        .carousel-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .carousel-overlay:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .carousel-button {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            background: linear-gradient(145deg, #e94560, #d63447);
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
            transition: all 0.3s ease;
        }

        .carousel-button:hover {
            background: linear-gradient(145deg, #d63447, #c02a3a);
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">🔭 Black Hole Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/search">🔍 Search</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <!-- FLASH MESSAGES -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        
        <!-- LEGACY ERROR SUPPORT -->
        {% if error %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            ❌ {{ error }}
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endif %}
        
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
