{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h1>Add Black Hole</h1>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="POST">
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Mass (Solar Masses)</label>
            <input type="number" step="0.01" name="mass_solar_masses" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Distance (Light Years)</label>
            <input type="number" step="0.01" name="distance_light_years" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Classification</label>
            <select name="classification" class="form-control" required>
                <option>Stellar</option>
                <option>Supermassive</option>
                <option>Intermediate</option>
            </select>
        </div>
        <div class="form-group">
            <label>Discovery Year</label>
            <input type="number" name="discovery_year" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Discovery Method</label>
            <select name="discovery_method_id" class="form-control">
                <option value="">Select Method</option>
                {% for method in methods %}
                <option value="{{ method[0] }}">{{ method[1] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>RA</label>
            <input type="number" step="0.01" name="ra" class="form-control">
        </div>
        <div class="form-group">
            <label>Dec</label>
            <input type="number" step="0.01" name="dec" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Add</button>
        <a href="{{ url_for('view_black_holes') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
